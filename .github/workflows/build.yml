name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write   # необходимо для создания релизов по тегу

env:
  # GitHub Actions с июня 2026 переводят JS-actions на Node.js 24.
  # Основные actions уже подняты до версий, нативно работающих на Node 24
  # (checkout@v6, upload-artifact@v7, download-artifact@v8). Флаг оставлен
  # как страховка для сторонних actions, ещё использующих Node 20
  # (например, softprops/action-gh-release@v2).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    name: Windows (Win32 + x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure x64
        run: cmake -S . -B build64W -A x64 -DTARGET_PLATFORM_32:BOOL=OFF

      - name: Build x64
        run: cmake --build build64W --config Release

      - name: Configure Win32
        run: cmake -S . -B build32W -A Win32 -DTARGET_PLATFORM_32:BOOL=ON

      - name: Build Win32
        run: cmake --build build32W --config Release

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: |
            bin32/Release/*.dll
            bin64/Release/*.dll
            bin32/Release/*.pdb
            bin64/Release/*.pdb
          if-no-files-found: error

  linux:
    name: Linux (x86 + x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install x86_64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential cmake elfutils \
              uuid-dev libxcb1-dev libpng-dev libx11-dev

      - name: Install i386 dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              gcc-multilib g++-multilib \
              uuid-dev:i386 libxcb1-dev:i386 libpng-dev:i386 libx11-dev:i386

      - name: Build x86_64
        run: |
          cmake -S . -B build64L \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DTARGET_PLATFORM_32:BOOL=OFF
          cmake --build build64L -- -j$(nproc)

      - name: Build i386
        run: |
          cmake -S . -B build32L \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DTARGET_PLATFORM_32:BOOL=ON
          cmake --build build32L -- -j$(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            bin32/*.so
            bin64/*.so
            bin32/*.so.debug
            bin64/*.so.debug
          if-no-files-found: error

  macos:
    name: macOS (x86_64 + arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # Отдельные сборки под каждую архитектуру (как в эталоне 1С): клиент
      # 8.3.21+ на Apple Silicon ищет в MANIFEST.XML запись arch="ARM64".
      # Обе сборки кладут dylib в bin64/ с разными именами
      # (Clip1CMac64.dylib / Clip1CMacARM64.dylib) и ad-hoc подписываются
      # в CMake POST_BUILD.
      - name: Build x86_64
        run: |
          cmake -S . -B build64Intel \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DTARGET_PLATFORM_32:BOOL=OFF \
              -DCMAKE_OSX_ARCHITECTURES=x86_64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build64Intel -- -j$(sysctl -n hw.ncpu)

      - name: Build arm64
        run: |
          cmake -S . -B build64Arm \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DTARGET_PLATFORM_32:BOOL=OFF \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build64Arm -- -j$(sysctl -n hw.ncpu)

      - name: Verify binaries (arch + signature)
        run: |
          for f in bin64/Clip1CMac64.dylib bin64/Clip1CMacARM64.dylib; do
            echo "== $f =="
            file "$f"
            lipo -info "$f"
            codesign -dv "$f" 2>&1 | head -3
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          path: bin64/*.dylib
          if-no-files-found: error

  package:
    name: Package AddIn.zip
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f -printf '%p\t%s\n' | sort

      - name: Read version
        id: ver
        run: |
          v=$(grep -oP '#define\s+VERSION_FULL\s+\K[\d.]+' version.h)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build AddIn.zip
        run: |
          python3 tools/make_bundle.py \
              --artifacts-dir artifacts \
              --output AddIn.zip \
              --strict

      - name: Inspect bundle
        run: |
          ls -la AddIn.zip
          unzip -l AddIn.zip
          unzip -p AddIn.zip MANIFEST.XML

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: AddIn-${{ steps.ver.outputs.version }}
          path: AddIn.zip
          if-no-files-found: error

      # При push'е тега вида v1.2.3 автоматически создаётся GitHub Release
      # с прикреплённым AddIn.zip. Если релиз с этим тегом уже существует
      # (например, был создан вручную через UI), action просто добавит файл.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AddIn.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
